<!-- === COOKIE BANNER === injectat de js/main.js în #cookie-placeholder -->
<div class="cookie" id="cookieBanner" role="dialog" aria-labelledby="cookieTitle"
     aria-describedby="cookieText" aria-modal="false" hidden>
  <div class="cookie__inner">
    <div class="cookie__body">
      <p class="cookie__title" id="cookieTitle">Cookie-uri</p>
      <p class="cookie__text" id="cookieText">
        Folosim doar cookie-uri strict necesare pentru funcționarea formularului.
        Cele de analiză se încarcă numai dacă le accepți.
        <a href="/politica-confidentialitate.html">Detalii</a>
      </p>
    </div>
    <div class="cookie__actions">
      <button type="button" class="btn btn--pill btn--outline cookie__btn" id="cookieReject">
        Refuz
      </button>
      <button type="button" class="btn btn--pill btn--dark cookie__btn" id="cookieAccept">
        Accept
      </button>
    </div>
  </div>
</div>
